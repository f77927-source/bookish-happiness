<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG Topup - Game Topup BD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0b0f19;color:#e2e8f0;min-height:100vh}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#16a34a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:bold;opacity:0;transition:.3s;z-index:99999;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:#dc2626}

/* CONTAINER */
.wrap{max-width:480px;margin:0 auto;background:#111827;min-height:100vh;display:flex;flex-direction:column;position:relative;box-shadow:0 0 30px rgba(0,0,0,.5)}

/* HEADER */
.header{background:#1f2937;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151;position:sticky;top:0;z-index:40}
.logo{font-weight:900;font-size:18px;color:#38bdf8;cursor:pointer;font-style:italic}
.user-info{display:flex;align-items:center;gap:10px}
.bal-pill{background:#374151;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;color:#4ade80}
.auth-btn{background:#2563eb;color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer}

/* CONTENT */
.content{flex:1;padding:16px;padding-bottom:80px;overflow-y:auto}

/* BANNER */
.banner{background:linear-gradient(135deg,#1e40af,#3b82f6);border-radius:12px;padding:20px;text-align:center;margin-bottom:16px}
.banner h2{font-size:18px;color:#fff;margin-bottom:6px}
.banner p{font-size:12px;color:#bfdbfe}

/* PRODUCTS GRID */
.sec-title{font-size:14px;font-weight:bold;color:#38bdf8;margin:16px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#1f2937;border:1px solid #374151;border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:.2s}
.card:hover{border-color:#38bdf8;transform:translateY(-2px)}
.card img{width:50px;height:50px;object-fit:cover;border-radius:8px;margin-bottom:8px}
.card h4{font-size:13px;color:#fff;margin-bottom:4px}
.card .price{font-size:12px;color:#4ade80;font-weight:bold}

/* FORMS & BOXES */
.box{background:#1f2937;border:1px solid #374151;border-radius:10px;padding:16px;margin-bottom:14px}
.box label{display:block;font-size:12px;color:#9ca3af;margin:10px 0 5px;font-weight:bold}
.box input,.box select{width:100%;padding:10px;border-radius:6px;border:1px solid #374151;background:#111827;color:#e2e8f0;font-size:13px;outline:none}
.box input:focus,.box select:focus{border-color:#38bdf8}
.btn{width:100%;padding:11px;border:none;border-radius:6px;font-weight:bold;font-size:13px;color:#fff;background:#2563eb;cursor:pointer;margin-top:12px}
.btn.ok{background:#16a34a}
.btn.ghost{background:#374151;margin-top:8px}

/* NAVIGATION BAR */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#1f2937;border-top:1px solid #374151;display:flex;justify-content:space-around;padding:10px 0;z-index:40}
.nav-item{background:none;border:none;color:#9ca3af;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav-item.active{color:#38bdf8}
.nav-item span:first-child{font-size:16px}

/* LIST ITEM */
.item{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:12px;margin-bottom:8px;font-size:13px}
.item .row{display:flex;justify-content:space-between;align-items:center}
.meta{font-size:11px;color:#9ca3af;margin-top:3px}
.badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:bold;background:#422006;color:#fbbf24}
</style>
</head>
<body>

<div class="wrap">
  <!-- HEADER -->
  <header class="header">
    <div class="logo" onclick="goTab('home')">RGTOPUP</div>
    <div class="user-info">
      <div class="bal-pill" id="hdrBal">৳0.00</div>
      <button class="auth-btn" id="hdrAuthBtn" onclick="openAuthModal()">লগইন</button>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="content" id="mainContent"></div>

  <!-- NAVIGATION -->
  <nav class="nav">
    <button class="nav-item active" id="nav-home" onclick="goTab('home')"><span>🏠</span><span>হোম</span></button>
    <button class="nav-item" id="nav-orders" onclick="goTab('orders')"><span>🧾</span><span>অর্ডার</span></button>
    <button class="nav-item" id="nav-profile" onclick="goTab('profile')"><span>👤</span><span>প্রোফাইল</span></button>
  </nav>
</div>

<!-- AUTH MODAL -->
<div id="authModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:16px">
  <div class="box" style="width:100%;max-width:340px;margin:0">
    <h3 id="authTitle" style="color:#fff;margin-bottom:10px">লগইন করুন</h3>
    <div id="regFields" style="display:none">
      <label>নাম</label>
      <input id="uName" placeholder="আপনার নাম">
    </div>
    <label>ইমেইল বা ফোন</label>
    <input id="uEmail" placeholder="example@gmail.com">
    <label>পাসওয়ার্ড</label>
    <input type="password" id="uPass" placeholder="******">
    <button class="btn" id="authSubmitBtn" onclick="handleAuth()">লগইন</button>
    <button class="btn ghost" onclick="toggleAuthMode()" id="authToggleBtn">একাউন্ট নেই? রেজিস্টার</button>
    <button class="btn ghost" onclick="document.getElementById('authModal').style.display='none'" style="background:#dc2626">বন্ধ করুন</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const get = (k, f) => { try { const d = localStorage.getItem(k); return d ? JSON.parse(d) : f; } catch(e){ return f; } };
const set = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

let currentUser = get('rg_curr_user', null);
let currentTab = 'home';
let selectedProduct = null;

function toast(msg, err){
  const t = document.getElementById('toast');
  if(!t) return;
  t.innerText = msg; t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.className = 'toast', 2200);
}

function updHeader(){
  const users = get('rg_users', []);
  if(currentUser){
    const u = users.find(x => x.email === currentUser);
    if(u){
      document.getElementById('hdrBal').innerText = '৳' + parseFloat(u.balance || 0).toFixed(2);
      document.getElementById('hdrAuthBtn').innerText = 'লগআউট';
      document.getElementById('hdrAuthBtn').onclick = logout;
    }
  } else {
    document.getElementById('hdrBal').innerText = '৳0.00';
    document.getElementById('hdrAuthBtn').innerText = 'লগইন';
    document.getElementById('hdrAuthBtn').onclick = openAuthModal;
  }
}

function goTab(tab){
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const btn = document.getElementById('nav-' + tab);
  if(btn) btn.classList.add('active');
  renderView();
}

function renderView(){
  updHeader();
  const c = document.getElementById('mainContent');
  if(currentTab === 'home') renderHome(c);
  else if(currentTab === 'orders') renderOrders(c);
  else if(currentTab === 'profile') renderProfile(c);
  else if(currentTab === 'checkout') renderCheckout(c);
}

/* HOME */
function renderHome(c){
  const products = [
    {id:'p1', name:'Free Fire Diamond', price:85, img:'https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=150', variants:[{name:'110 Diamonds', price:85},{name:'253 Diamonds', price:190}]},
    {id:'p2', name:'PUBG Mobile UC', price:95, img:'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=150', variants:[{name:'60 UC', price:95},{name:'325 UC', price:480}]}
  ];

  c.innerHTML = `
    <div class="banner">
      <h2>🔥 ফাস্ট গেম টপ-আপ</h2>
      <p>ইনস্ট্যান্ট ডায়মন্ড ও ইউসি টপ-আপ করুন!</p>
    </div>
    <div class="sec-title"><span>🎮 গেম লিস্ট</span></div>
    <div class="grid">
      ${products.map(p => `
        <div class="card" onclick="openCheckout('${p.id}')">
          <img src="${p.img}">
          <h4>${p.name}</h4>
          <div class="price">৳${p.price} থেকে শুরু</div>
        </div>`).join('')}
    </div>
  `;
}

/* CHECKOUT */
function openCheckout(id){
  const products = [
    {id:'p1', name:'Free Fire Diamond', variants:[{name:'110 Diamonds', price:85},{name:'253 Diamonds', price:190}]},
    {id:'p2', name:'PUBG Mobile UC', variants:[{name:'60 UC', price:95},{name:'325 UC', price:480}]}
  ];
  selectedProduct = products.find(p => p.id === id);
  if(!selectedProduct) return;
  currentTab = 'checkout';
  renderView();
}

function renderCheckout(c){
  if(!selectedProduct){ goTab('home'); return; }
  c.innerHTML = `
    <div class="sec-title" style="cursor:pointer" onclick="goTab('home')"><span>← ব্যাке যান</span></div>
    <div class="box">
      <h3 style="color:#fff;margin-bottom:10px">${selectedProduct.name}</h3>
      <label>প্যাকেজ সিলেক্ট করুন</label>
      <select id="chkVariant">
        ${selectedProduct.variants.map((v, i) => `<option value="${i}">${v.name} — ৳${v.price}</option>`).join('')}
      </select>
      <label>গেম ইউজার আইডি (UID)</label>
      <input id="chkUid" placeholder="আপনার গেম UID দিন">
      <button class="btn ok" onclick="submitOrder()">অর্ডার নিশ্চিত করুন</button>
    </div>
  `;
}

function submitOrder(){
  if(!currentUser){ openAuthModal(); return; }
  const uid = val('chkUid');
  if(!uid){ toast('দয়া করে গেম UID দিন!', true); return; }
  
  const vIndex = parseInt(document.getElementById('chkVariant').value);
  const chosenVar = selectedProduct.variants[vIndex];

  const orders = get('rg_orders', []);
  orders.unshift({
    id: Date.now(),
    user: currentUser,
    pack: selectedProduct.name + ' (' + chosenVar.name + ')',
    price: chosenVar.price,
    uid: uid,
    status: 'Pending',
    date: new Date().toLocaleString()
  });
  set('rg_orders', orders);

  toast('✅ সফলভাবে অর্ডার জমা হয়েছে!');
  goTab('orders');
}

/* ORDERS */
function renderOrders(c){
  if(!currentUser){ c.innerHTML = `<p style="text-align:center;padding:40px;color:#9ca3af">লগইন করুন অর্ডার দেখতে</p>`; return; }
  const orders = get('rg_orders', []).filter(o => o.user === currentUser);
  c.innerHTML = `
    <div class="sec-title"><span>🧾 আপনার অর্ডারসমূহ</span></div>
    ${orders.length ? orders.map(o => `
      <div class="item">
        <div class="row"><b>${o.pack}</b><span style="color:#4ade80;font-weight:bold">৳${o.price}</span></div>
        <div class="meta">🎮 UID: ${o.uid}</div>
        <div class="meta">🕒 ${o.date}</div>
        <div class="row" style="margin-top:6px"><span class="badge">${o.status}</span></div>
      </div>`).join('') : '<p style="text-align:center;color:#9ca3af;padding:30px">কোনো অর্ডার নেই</p>'}
  `;
}

/* PROFILE */
function renderProfile(c){
  if(!currentUser){ openAuthModal(); return; }
  const users = get('rg_users', []);
  const u = users.find(x => x.email === currentUser) || {};
  c.innerHTML = `
    <div class="sec-title"><span>👤 একাউন্ট তথ্য</span></div>
    <div class="box">
      <h3 style="color:#fff">${u.name || 'User'}</h3>
      <p class="meta">📧 ${u.email}</p>
      <button class="btn ghost" onclick="logout()" style="background:#dc2626;margin-top:15px">লগআউট করুন</button>
    </div>
  `;
}

/* AUTH */
let isReg = false;
function openAuthModal(){ document.getElementById('authModal').style.display = 'flex'; }
function toggleAuthMode(){
  isReg = !isReg;
  document.getElementById('authTitle').innerText = isReg ? 'রেজিস্ট্রেশন করুন' : 'লগইন করুন';
  document.getElementById('regFields').style.display = isReg ? 'block' : 'none';
  document.getElementById('authSubmitBtn').innerText = isReg ? 'রেজিস্ট্রার' : 'লগইন';
  document.getElementById('authToggleBtn').innerText = isReg ? 'একাউন্ট আছে? লগইন' : 'একাউন্ট নেই? রেজিস্টার';
}

function handleAuth(){
  const email = val('uEmail'), pass = val('uPass'), name = val('uName');
  if(!email || !pass){ toast('ইমেইল ও পাসওয়ার্ড দিন!', true); return; }
  let users = get('rg_users', []);

  if(isReg){
    if(users.some(x => x.email === email)){ toast('এই ইমেইল দিয়ে আগেই একাউন্ট খোলা হয়েছে!', true); return; }
    users.push({name: name || 'User', email: email, pass: pass, balance: 0});
    set('rg_users', users);
    currentUser = email;
    set('rg_curr_user', currentUser);
    toast('✅ সফলভাবে রেজিস্টার হয়েছে!');
  } else {
    const u = users.find(x => x.email === email && x.pass === pass);
    if(!u){ toast('ভুল ইমেইল বা পাসওয়ার্ড!', true); return; }
    currentUser = email;
    set('rg_curr_user', currentUser);
    toast('✅ সফলভাবে লগইন হয়েছে!');
  }
  document.getElementById('authModal').style.display = 'none';
  renderView();
}

function logout(){
  currentUser = null;
  localStorage.removeItem('rg_curr_user');
  toast('লগআউট হয়েছে');
  renderView();
}

renderView();
</script>
</body>
</html>
