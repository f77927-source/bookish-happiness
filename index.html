<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub - Where the world builds software</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Noto,Helvetica,Arial,sans-serif}
body{background:#0d1117;color:#c9d1d9;min-height:100vh}

/* HEADER */
.header{background:#161b22;border-bottom:1px solid #30363d;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:16px}
.logo-svg{width:32px;height:32px;fill:#fff;cursor:pointer}
.search-box{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:5px 12px;color:#8b949e;font-size:14px;width:240px;outline:none}
.search-box:focus{border-color:#58a6ff;width:300px;transition:.2s}
.header-right{display:flex;align-items:center;gap:12px}
.avatar{width:28px;height:28px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;color:#fff;cursor:pointer}

/* LAYOUT */
.container{max-width:1280px;margin:0 auto;display:flex;min-height:calc(100vh - 58px)}
.sidebar{width:280px;border-right:1px solid #30363d;padding:24px 16px;background:#0d1117}
.main-content{flex:1;padding:24px;background:#0d1117}

/* SIDEBAR REPOS */
.side-title{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.new-btn{background:#238636;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.new-btn:hover{background:#2ea043}
.repo-search{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:4px 8px;color:#c9d1d9;font-size:12px;margin-bottom:12px;outline:none}
.repo-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;color:#c9d1d9;cursor:pointer;text-decoration:none}
.repo-item:hover{color:#58a6ff}

/* DASHBOARD / MAIN */
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid #30363d;padding-bottom:12px}
.dash-title{font-size:20px;font-weight:600;color:#fff}
.card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:16px;margin-bottom:16px}
.card h3{font-size:16px;color:#58a6ff;margin-bottom:8px;cursor:pointer}
.card p{font-size:13px;color:#8b949e;margin-bottom:12px}

/* REPO VIEW */
.repo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.repo-name-path{font-size:20px;color:#58a6ff;font-weight:600}
.file-list{background:#161b22;border:1px solid #30363d;border-radius:6px;margin-top:12px}
.file-row{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid #30363d;font-size:13px;gap:10px}
.file-row:last-child{border-bottom:none}
.file-row span:first-child{font-size:16px}

/* MODAL FOR NEW REPO */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center}
.modal-box{background:#161b22;border:1px solid #30363d;border-radius:12px;width:100%;max-width:500px;padding:24px}
.modal-box h2{font-size:18px;color:#fff;margin-bottom:16px}
.modal-box label{display:block;font-size:13px;color:#8b949e;margin:12px 0 6px;font-weight:600}
.modal-box input, .modal-box textarea{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:8px 12px;color:#c9d1d9;font-size:14px;outline:none}
.modal-box input:focus, .modal-box textarea:focus{border-color:#58a6ff}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn-cancel{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600}
.btn-create{background:#238636;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600}
</style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <!-- GitHub Logo SVG -->
      <svg class="logo-svg" height="32" viewBox="0 0 16 16" width="32" onclick="goHome()"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
      <input type="text" class="search-box" placeholder="Type / to search">
    </div>
    <div class="header-right">
      <div class="avatar">U</div>
    </div>
  </header>

  <!-- CONTAINER -->
  <div class="container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="side-title">
        <span>Top Repositories</span>
        <button class="new-btn" onclick="openModal()">New</button>
      </div>
      <input type="text" class="repo-search" placeholder="Find a repository..." id="searchRepoInput" oninput="filterRepos()">
      <div id="repoList"></div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">
      <!-- Dynamic View injected here -->
    </main>
  </div>

  <!-- NEW REPO MODAL -->
  <div class="modal" id="repoModal">
    <div class="modal-box">
      <h2>Create a new repository</h2>
      <label>Repository name</label>
      <input type="text" id="newRepoName" placeholder="my-awesome-project">
      <label>Description (optional)</label>
      <textarea id="newRepoDesc" placeholder="Write a short description"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-create" onclick="createRepository()">Create repository</button>
      </div>
    </div>
  </div>

<script>
// LocalStorage helpers
const getRepos = () => {
  const d = localStorage.getItem('gh_repos');
  return d ? JSON.parse(d) : [
    {name: 'react', desc: 'The library for web and native user interfaces', files: ['README.md', 'package.json', 'index.js']},
    {name: 'vscode', desc: 'Visual Studio Code', files: ['README.md', 'LICENSE', 'src/', 'package.json']}
  ];
};
const setRepos = (r) => localStorage.setItem('gh_repos', JSON.stringify(r));

let currentView = 'home'; // 'home' or 'repo'
let activeRepoName = null;

function goHome(){
  currentView = 'home';
  activeRepoName = null;
  render();
}

function openRepo(name){
  currentView = 'repo';
  activeRepoName = name;
  render();
}

function render(){
  renderSidebar();
  const main = document.getElementById('mainContent');
  if(currentView === 'home'){
    renderDashboard(main);
  } else if(currentView === 'repo'){
    renderRepoDetail(main);
  }
}

function renderSidebar(){
  const list = document.getElementById('repoList');
  const repos = getRepos();
  list.innerHTML = repos.map(r => `
    <div class="repo-item" onclick="openRepo('${r.name}')">
      <span>📁</span> <span>${r.name}</span>
    </div>
  `).join('');
}

function filterRepos(){
  const query = document.getElementById('searchRepoInput').value.toLowerCase();
  const items = document.querySelectorAll('.repo-item');
  items.forEach(item => {
    const text = item.innerText.toLowerCase();
    item.style.display = text.includes(query) ? 'flex' : 'none';
  });
}

function renderDashboard(container){
  const repos = getRepos();
  container.innerHTML = `
    <div class="dash-header">
      <div class="dash-title">Home Dashboard</div>
      <button class="new-btn" onclick="openModal()">+ New repository</button>
    </div>
    <p style="color:#8b949e;margin-bottom:16px;font-size:14px">Your repositories</p>
    ${repos.map(r => `
      <div class="card">
        <h3 onclick="openRepo('${r.name}')">${r.name}</h3>
        <p>${r.desc || 'No description provided'}</p>
        <span style="font-size:12px;color:#8b949e">Public • Updated recently</span>
      </div>
    `).join('')}
  `;
}

function renderRepoDetail(container){
  const repos = getRepos();
  const repo = repos.find(r => r.name === activeRepoName);
  if(!repo){ goHome(); return; }

  container.innerHTML = `
    <div class="repo-header">
      <div class="repo-name-path"><span>📁 user / </span><b>${repo.name}</b></div>
    </div>
    <p style="color:#8b949e;font-size:14px;margin-bottom:16px">${repo.desc || ''}</p>
    
    <div style="background:#161b22;border:1px solid #30363d;padding:10px 16px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center">
      <span>main <b>📁 Branch</b></span>
      <button class="new-btn" onclick="addFile('${repo.name}')">+ Add file</button>
    </div>

    <div class="file-list">
      ${(repo.files || ['README.md']).map(f => `
        <div class="file-row">
          <span>📄</span>
          <b style="color:#c9d1d9">${f}</b>
          <span style="color:#8b949e;margin-left:auto">Initial commit</span>
        </div>
      `).join('')}
    </div>
  `;
}

function addFile(repoName){
  const fileName = prompt("Enter new file name (e.g., script.js):");
  if(!fileName) return;
  const repos = getRepos();
  const repo = repos.find(r => r.name === repoName);
  if(repo){
    repo.files = repo.files || [];
    repo.files.push(fileName);
    setRepos(repos);
    render();
  }
}

// Modal controls
function openModal(){ document.getElementById('repoModal').style.display = 'flex'; }
function closeModal(){ document.getElementById('repoModal').style.display = 'none'; }

function createRepository(){
  const name = document.getElementById('newRepoName').value.trim();
  const desc = document.getElementById('newRepoDesc').value.trim();
  if(!name){ alert('Please enter repository name'); return; }

  const repos = getRepos();
  if(repos.some(r => r.name === name)){ alert('Repository already exists!'); return; }

  repos.unshift({name, desc, files: ['README.md']});
  setRepos(repos);
  closeModal();
  document.getElementById('newRepoName').value = '';
  document.getElementById('newRepoDesc').value = '';
  openRepo(name);
}

// Initial render
render();
</script>
</body>
  </html>
